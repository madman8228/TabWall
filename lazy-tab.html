<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="icons/icon32.png">
    <title>TabWall</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f4f6fb;
        color: #25324a;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      p {
        max-width: 32rem;
        padding: 1rem 1.25rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <p id="lazy-message">This tab is ready and will load when selected.</p>
    <script src="lazy-tab.js"></script>
  </body>
</html>

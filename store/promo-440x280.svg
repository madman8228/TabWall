<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">TabWall promotional tile</title>
  <desc id="desc">Save, organize, and restore browser tabs with TabWall.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" rx="26" fill="url(#background)"/>
  <circle cx="408" cy="18" r="92" fill="#dcecff" opacity=".58"/>
  <circle cx="4" cy="278" r="72" fill="#e4f8f5" opacity=".72"/>
  <image href="logo-300.png" x="16" y="42" width="188" height="188" preserveAspectRatio="xMidYMid meet"/>
  <text x="220" y="113" fill="#172033" font-family="Inter,Segoe UI,sans-serif" font-size="34" font-weight="800" letter-spacing="-1.8">TabWall</text>
  <text x="222" y="145" fill="#46618b" font-family="Inter,Segoe UI,sans-serif" font-size="13.5" font-weight="600">Organize tabs, save memory.</text>
  <rect x="222" y="170" width="104" height="4" rx="2" fill="#4f68d6"/>
</svg>
